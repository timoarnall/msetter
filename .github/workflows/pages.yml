# Publishes the project page (site/) with the app beside it at app/, on every push to main, once the repository
# is public and Pages is set to "GitHub Actions" in the repository settings. Skipped while private.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: node --test test/*.test.js
      - run: mkdir -p _site/app && cp -R site/. _site/ && cp index.html _site/app/ && cp -R src _site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
