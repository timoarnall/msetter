name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - name: Generated docs and the limits chart are up to date
        run: python3 tools/build_docs.py && node tools/build_limits_chart.js && git diff --exit-code docs site/images
