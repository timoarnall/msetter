<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Msetter</title>
<meta name="description" content="Design user profiles for Leica M11-family cameras and save them as a settings file the camera imports.">
<link rel="stylesheet" href="src/app.css?v=22">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Themes">

  <aside class="cam" id="cam" aria-label="Camera"></aside>

</div>
<input type="file" id="file" accept=".lcse,.json,application/json" hidden>
<script src="src/rules.js?v=22"></script>

</html>
