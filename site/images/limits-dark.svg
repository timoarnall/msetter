<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 354" width="820" height="354" role="img" aria-label="Speed ladder set. Fast: speed limit 1/1000, maximum ISO 6400. Medium: speed limit 1/250, maximum ISO 6400. Slow: speed limit 1/(4f), maximum ISO 3200. Sloow: speed limit 1/(4f), maximum ISO 64."><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-weight:600}</style><text x="115.0" y="22" text-anchor="start" fill="#d6d4cf" font-size="17">Shutter speed limit</text><text x="0.0" y="68" text-anchor="start" fill="#d6d4cf" font-size="16">Fast</text><line x1="141.0" y1="62" x2="450.0" y2="62" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="62" x2="141.0" y2="62" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="141.0" cy="62" r="7" fill="#F0303D"/><text x="141.0" y="48" text-anchor="middle" fill="#d6d4cf" font-size="15">1/1000</text><text x="0.0" y="118" text-anchor="start" fill="#d6d4cf" font-size="16">Medium</text><line x1="203.0" y1="112" x2="450.0" y2="112" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="112" x2="203.0" y2="112" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="203.0" cy="112" r="7" fill="#F0303D"/><text x="203.0" y="98" text-anchor="middle" fill="#d6d4cf" font-size="15">1/250</text><text x="0.0" y="168" text-anchor="start" fill="#d6d4cf" font-size="16">Slow</text><line x1="213.0" y1="162" x2="450.0" y2="162" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="162" x2="213.0" y2="162" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="213.0" cy="162" r="7" fill="#F0303D"/><text x="213.0" y="148" text-anchor="middle" fill="#d6d4cf" font-size="15">1/(4f)</text><text x="0.0" y="218" text-anchor="start" fill="#d6d4cf" font-size="16">Sloow</text><line x1="213.0" y1="212" x2="450.0" y2="212" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="212" x2="213.0" y2="212" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="213.0" cy="212" r="7" fill="#F0303D"/><text x="213.0" y="198" text-anchor="middle" fill="#d6d4cf" font-size="15">1/(4f)</text><text x="141.0" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/1000</text><text x="203.0" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/250</text><text x="266.9" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/60</text><text x="328.9" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/15</text><text x="388.0" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/4</text><text x="450.0" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1 s</text><text x="115.0" y="270" text-anchor="start" fill="#8a8781" font-size="13">faster</text><text x="455.0" y="270" text-anchor="end" fill="#8a8781" font-size="13">slower</text><text x="515.0" y="22" text-anchor="start" fill="#d6d4cf" font-size="17">Maximum ISO</text><line x1="520.0" y1="62" x2="717.7" y2="62" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="717.7" cy="62" r="7" fill="#F0303D"/><text x="717.7" y="48" text-anchor="middle" fill="#d6d4cf" font-size="15">6400</text><line x1="520.0" y1="112" x2="717.7" y2="112" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="717.7" cy="112" r="7" fill="#F0303D"/><text x="717.7" y="98" text-anchor="middle" fill="#d6d4cf" font-size="15">6400</text><line x1="520.0" y1="162" x2="688.0" y2="162" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="688.0" cy="162" r="7" fill="#F0303D"/><text x="688.0" y="148" text-anchor="middle" fill="#d6d4cf" font-size="15">3200</text><line x1="520.0" y1="212" x2="520.0" y2="212" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="520.0" cy="212" r="7" fill="#F0303D"/><text x="538.0" y="198" text-anchor="middle" fill="#d6d4cf" font-size="15">64</text><text x="520.0" y="250" text-a