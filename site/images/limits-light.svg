<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" width="560" height="236" role="img" aria-label="As light falls, the shutter speed slows until it reaches the speed limit. Then ISO climbs until it reaches the maximum. Then the shutter slows past the limit."><style>text{font:600 13px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}</style><text x="0" y="54" text-anchor="start" fill="#1a1a1a">Shutter</text><text x="0" y="70" text-anchor="start" fill="#77746e">speed</text><text x="0" y="176" text-anchor="start" fill="#1a1a1a">ISO</text><text x="560" y="14" text-anchor="end" fill="#77746e">Less light →</text><path d="M100 30 L230 82 L390 82 L540 116" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 192 L230 192 L390 146 L540 146" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="82" r="5" fill="#E20612"/><circle cx="390" cy="146" r="5" fill="#E20612"/><text x="310" y="72" text-anchor="middle" fill="#1a1a1a">Speed limit 1/250</text><text x="465" y="136" text-anchor="middle" fill="#1a1a1a">Maximum ISO 6400</text><text x="165" y="228" text-anchor="middle" fill="#77746e">Shutter slows</text><text x="310" y="228" text-anchor="middle" fill="#77746e">ISO climbs</text><text x="465" y="228" text-anchor="middle" fill="#77746e">Shutter slows again</text></svg>
