<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356" role="img" aria-label="Speed ladder set. Fast: speed limit 1/1000, maximum ISO 6400. Medium: speed limit 1/250, maximum ISO 6400. Slow: speed limit 1/(4f), maximum ISO 3200. Sloow: speed limit 1/(4f), maximum ISO 64."><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-weight:600}</style><text x="115.0" y="22" text-anchor="start" fill="#1a1a1a" font-size="17">Shutter speed limit</text><text x="0.0" y="70" text-anchor="start" fill="#1a1a1a" font-size="17">Fast</text><line x1="179.7" y1="64" x2="450.0" y2="64" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="64" x2="179.7" y2="64" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="179.7" cy="64" r="7" fill="#E20612"/><text x="179.7" y="50" text-anchor="middle" fill="#1a1a1a" font-size="13">1/1000</text><text x="0.0" y="120" text-anchor="start" fill="#1a1a1a" font-size="17">Medium</text><line x1="234.0" y1="114" x2="450.0" y2="114" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="114" x2="234.0" y2="114" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="234.0" cy="114" r="7" fill="#E20612"/><text x="234.0" y="100" text-anchor="middle" fill="#1a1a1a" font-size="13">1/250</text><text x="0.0" y="170" text-anchor="start" fill="#1a1a1a" font-size="17">Slow</text><line x1="242.7" y1="164" x2="450.0" y2="164" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="164" x2="242.7" y2="164" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="242.7" cy="164" r="7" fill="#E20612"/><text x="242.7" y="150" text-anchor="middle" fill="#1a1a1a" font-size="13">1/(4f)</text><text x="0.0" y="220" text-anchor="start" fill="#1a1a1a" font-size="17">Sloow</text><line x1="242.7" y1="214" x2="450.0" y2="214" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="120.0" y1="214" x2="242.7" y2="214" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="242.7" cy="214" r="7" fill="#E20612"/><text x="242.7" y="200" text-anchor="middle" fill="#1a1a1a" font-size="13">1/(4f)</text><text x="125.5" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/4000</text><text x="179.7" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/1000</text><text x="234.0" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/250</text><text x="289.8" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/60</text><text x="344.0" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/15</text><text x="395.8" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/4</text><text x="450.0" y="252" text-anchor="middle" fill="#77746e" font-size="13">1 s</text><text x="115.0" y="272" text-anchor="start" fill="#77746e" font-size="13">faster</text><text x="455.0" y="272" text-anchor="end" fill="#77746e" font-size="13">slower</text><text x="515.0" y="22" text-anchor="start" fill="#1a1a1a" font-size="17">Maximum ISO</text><line x1="520.0" y1="64" x2="717.7" y2="64" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="717.7" cy="64" r="7" fill="#E20612"/><text x="717.7" y="50" text-anchor="middle" fill="#1a1a1a" font-size="13">6400</text><line x1="520.0" y1="114" x2="717.7" y2="114" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="717.7" cy="114" r="7" fill="#E20612"/><text x="717.7" y="100" text-anchor="middle" fill="#1a1a1a" font-size="13">6400</text><line x1="520.0" y1="164" x2="688.0" y2="164" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="688.0" cy="164" r="7" fill="#E20612"/><text x="688.0" y="150" text-anchor="middle" fill="#1a1a1a" font-size="13">3200</text><line x1="520.0" y1="214" x2="520.0" y2="214" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="520.0" cy="214" r="7" fill="#E20612"/><text x="538.0" y="200" 