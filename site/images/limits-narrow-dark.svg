<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 680" width="390" height="680" role="img" aria-label="Speed ladder set. Fast: speed limit 1/1000, maximum ISO 6400. Medium: speed limit 1/250, maximum ISO 6400. Slow: speed limit 1/(4f), maximum ISO 3200. Sloow: speed limit 1/(4f), maximum ISO 64."><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-weight:600}</style><text x="71.0" y="22" text-anchor="start" fill="#d6d4cf" font-size="17">Shutter speed limit</text><text x="0.0" y="68" text-anchor="start" fill="#d6d4cf" font-size="16">Fast</text><line x1="95.1" y1="62" x2="376.0" y2="62" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="62" x2="95.1" y2="62" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="95.1" cy="62" r="7" fill="#F0303D"/><text x="95.1" y="48" text-anchor="middle" fill="#d6d4cf" font-size="15">1/1000</text><text x="0.0" y="118" text-anchor="start" fill="#d6d4cf" font-size="16">Medium</text><line x1="151.5" y1="112" x2="376.0" y2="112" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="112" x2="151.5" y2="112" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="151.5" cy="112" r="7" fill="#F0303D"/><text x="151.5" y="98" text-anchor="middle" fill="#d6d4cf" font-size="15">1/250</text><text x="0.0" y="168" text-anchor="start" fill="#d6d4cf" font-size="16">Slow</text><line x1="160.6" y1="162" x2="376.0" y2="162" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="162" x2="160.6" y2="162" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="160.6" cy="162" r="7" fill="#F0303D"/><text x="160.6" y="148" text-anchor="middle" fill="#d6d4cf" font-size="15">1/(4f)</text><text x="0.0" y="218" text-anchor="start" fill="#d6d4cf" font-size="16">Sloow</text><line x1="160.6" y1="212" x2="376.0" y2="212" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="212" x2="160.6" y2="212" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="160.6" cy="212" r="7" fill="#F0303D"/><text x="160.6" y="198" text-anchor="middle" fill="#d6d4cf" font-size="15">1/(4f)</text><text x="95.1" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/1000</text><text x="151.5" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/250</text><text x="209.5" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/60</text><text x="265.9" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/15</text><text x="319.6" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1/4</text><text x="376.0" y="250" text-anchor="middle" fill="#8a8781" font-size="13">1 s</text><text x="71.0" y="270" text-anchor="start" fill="#8a8781" font-size="13">faster</text><text x="381.0" y="270" text-anchor="end" fill="#8a8781" font-size="13">slower</text><text x="71.0" y="320" text-anchor="start" fill="#d6d4cf" font-size="17">Maximum ISO</text><text x="0.0" y="366" text-anchor="start" fill="#d6d4cf" font-size="16">Fast</text><line x1="76.0" y1="360" x2="283.4" y2="360" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="283.4" cy="360" r="7" fill="#F0303D"/><text x="283.4" y="346" text-anchor="middle" fill="#d6d4cf" font-size="15">6400</text><text x="0.0" y="416" text-anchor="start" fill="#d6d4cf" font-size="16">Medium</text><line x1="76.0" y1="410" x2="283.4" y2="410" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="283.4" cy="410" r="7" fill="#F0303D"/><text x="283.4" y="396" text-anchor="middle" fill="#d6d4cf" font-size="15">6400</text><text x="0.0" y="466" text-anchor="start" fill="#d6d4cf" font-size="16">Slow</text><line x1="76.0" y1="460" x2="252.2" y2="460" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="252.2" cy="460" r="7" fill="#F0303D"/><text x="252.2" y="446" text-anchor="middle" fill="#d6d4cf" font-size="15">3200</text><text x="0.0" y="516" text-anchor="start" fill="#d6d4cf" font-size="16">Sloow</text><line x1="76.0" y1="510" x2="76.0" y2="510" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><circle cx="76.0" cy="510" r="7" fill="#F0303D"/><text x="94.0" y="496" text-anchor="middle" fill="#d6d4cf" font-size="15">64</text><text x="76.0" y="548" text-anchor="middle" fill="#8a8781" font-size="13">64</text><text x="158.5" y="548" text-anchor="middle" fill="#8a8781" font-size="13">400</text><text x="252.2" y="548" text-anchor="middle" fill="#8a8781" font-size="13">3200</text><text x="344.8" y="548" text-anchor="middle" fill="#8a8781" font-size="13">25000</text><text x="71.0" y="568" text-anchor="start" fill="#8a8781" font-size="13">cleaner</text><text x="381.0" y="568" text-anchor="end" fill="#8a8781" font-size="13">noisier</text><line x1="76.0" y1="607" x2="110.0" y2="607" stroke="#d6d4cf" stroke-width="9" stroke-linecap="round"/><text x="126.0" y="612" text-anchor="start" fill="#8a8781" font-size="14">what the camera uses</text><circle cx="93.0" cy="635" r="7" fill="#F0303D"/><text x="126.0" y="640" text-anchor="start" fill="#8a8781" font-size="14">the profile’s limit</text><line x1="76.0" y1="663" x2="110.0" y2="663" stroke="#3a3936" stroke-width="9" stroke-linecap="round"/><text x="126.0" y="668" text-anchor="start" fill="#8a8781" font-size="14">slower, once ISO is at its maximum</text></svg>
