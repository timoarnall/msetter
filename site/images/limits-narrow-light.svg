<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 684" width="390" height="684" role="img" aria-label="Speed ladder set. Fast: speed limit 1/1000, maximum ISO 6400. Medium: speed limit 1/250, maximum ISO 6400. Slow: speed limit 1/(4f), maximum ISO 3200. Sloow: speed limit 1/(4f), maximum ISO 64."><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-weight:600}</style><text x="71.0" y="22" text-anchor="start" fill="#1a1a1a" font-size="17">Shutter speed limit</text><text x="0.0" y="70" text-anchor="start" fill="#1a1a1a" font-size="17">Fast</text><line x1="130.3" y1="64" x2="376.0" y2="64" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="64" x2="130.3" y2="64" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="130.3" cy="64" r="7" fill="#E20612"/><text x="130.3" y="50" text-anchor="middle" fill="#1a1a1a" font-size="13">1/1000</text><text x="0.0" y="120" text-anchor="start" fill="#1a1a1a" font-size="17">Medium</text><line x1="179.6" y1="114" x2="376.0" y2="114" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="114" x2="179.6" y2="114" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="179.6" cy="114" r="7" fill="#E20612"/><text x="179.6" y="100" text-anchor="middle" fill="#1a1a1a" font-size="13">1/250</text><text x="0.0" y="170" text-anchor="start" fill="#1a1a1a" font-size="17">Slow</text><line x1="187.5" y1="164" x2="376.0" y2="164" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="164" x2="187.5" y2="164" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="187.5" cy="164" r="7" fill="#E20612"/><text x="187.5" y="150" text-anchor="middle" fill="#1a1a1a" font-size="13">1/(4f)</text><text x="0.0" y="220" text-anchor="start" fill="#1a1a1a" font-size="17">Sloow</text><line x1="187.5" y1="214" x2="376.0" y2="214" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><line x1="76.0" y1="214" x2="187.5" y2="214" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="187.5" cy="214" r="7" fill="#E20612"/><text x="187.5" y="200" text-anchor="middle" fill="#1a1a1a" font-size="13">1/(4f)</text><text x="81.0" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/4000</text><text x="130.3" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/1000</text><text x="179.6" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/250</text><text x="230.4" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/60</text><text x="279.7" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/15</text><text x="326.7" y="252" text-anchor="middle" fill="#77746e" font-size="13">1/4</text><text x="376.0" y="252" text-anchor="middle" fill="#77746e" font-size="13">1 s</text><text x="71.0" y="272" text-anchor="start" fill="#77746e" font-size="13">faster</text><text x="381.0" y="272" text-anchor="end" fill="#77746e" font-size="13">slower</text><text x="71.0" y="322" text-anchor="start" fill="#1a1a1a" font-size="17">Maximum ISO</text><text x="0.0" y="370" text-anchor="start" fill="#1a1a1a" font-size="17">Fast</text><line x1="76.0" y1="364" x2="283.4" y2="364" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="283.4" cy="364" r="7" fill="#E20612"/><text x="283.4" y="350" text-anchor="middle" fill="#1a1a1a" font-size="13">6400</text><text x="0.0" y="420" text-anchor="start" fill="#1a1a1a" font-size="17">Medium</text><line x1="76.0" y1="414" x2="283.4" y2="414" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="283.4" cy="414" r="7" fill="#E20612"/><text x="283.4" y="400" text-anchor="middle" fill="#1a1a1a" font-size="13">6400</text><text x="0.0" y="470" text-anchor="start" fill="#1a1a1a" font-size="17">Slow</text><line x1="76.0" y1="464" x2="252.2" y2="464" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="252.2" cy="464" r="7" fill="#E20612"/><text x="252.2" y="450" text-anchor="middle" fill="#1a1a1a" font-size="13">3200</text><text x="0.0" y="520" text-anchor="start" fill="#1a1a1a" font-size="17">Sloow</text><line x1="76.0" y1="514" x2="76.0" y2="514" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><circle cx="76.0" cy="514" r="7" fill="#E20612"/><text x="94.0" y="500" text-anchor="middle" fill="#1a1a1a" font-size="13">64</text><text x="76.0" y="552" text-anchor="middle" fill="#77746e" font-size="13">64</text><text x="158.5" y="552" text-anchor="middle" fill="#77746e" font-size="13">400</text><text x="252.2" y="552" text-anchor="middle" fill="#77746e" font-size="13">3200</text><text x="344.8" y="552" text-anchor="middle" fill="#77746e" font-size="13">25000</text><text x="71.0" y="572" text-anchor="start" fill="#77746e" font-size="13">cleaner</text><text x="381.0" y="572" text-anchor="end" fill="#77746e" font-size="13">noisier</text><line x1="76.0" y1="611" x2="110.0" y2="611" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><text x="126.0" y="616" text-anchor="start" fill="#77746e" font-size="13">what the camera uses</text><circle cx="93.0" cy="639" r="7" fill="#E20612"/><text x="126.0" y="644" text-anchor="start" fill="#77746e" font-size="13">the profile’s limit</text><line x1="76.0" y1="667" x2="110.0" y2="667" stroke="#d9d7d1" stroke-width="9" stroke-linecap="round"/><text x="126.0" y="672" text-anchor="start" fill="#77746e" font-size="13">slower, once ISO is at its maximum</text></svg>
